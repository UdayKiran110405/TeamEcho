# ===================================================================
# Server Configuration
# ===================================================================
server.port=9090
server.servlet.context-path=/

# ===================================================================
# MySQL Database Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/echo_attendance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=uday
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# 'validate' ensures Hibernate checks existing tables without modifying them,
# since the schema was manually created via SQL script.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Physical Naming Strategy (ensures custom uppercase names like ECHO_USERS remain intact)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===================================================================
# JWT & Security Configuration
# ===================================================================
# 256-bit base64 secret key
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 hours in milliseconds (86400000)
app.jwt.expiration-ms=86400000